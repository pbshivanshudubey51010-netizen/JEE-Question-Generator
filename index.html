<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEE Question Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#111;padding:14px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:18px;margin-bottom:12px;color:#1a56db}
h2{font-size:14px;margin-bottom:8px;color:#374151}
.chip{padding:8px 14px;border:1px solid #ddd;border-radius:16px;background:#fff;cursor:pointer;margin:3px;font-size:13px}
.chip.on{background:#1a56db;color:#fff;border-color:#1a56db}
.chap{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #eee;border-radius:6px;margin-top:4px;font-size:13px;cursor:pointer}
.chap input{width:18px;height:18px}
.opt{display:block;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:6px;cursor:pointer;font-size:14px}
.opt.sel{background:#eff6ff;border-color:#1a56db}
.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#1a56db;color:#fff;font-size:15px;font-weight:600;margin-top:8px;cursor:pointer}
.btn.sec{background:#fff;color:#1a56db;border:1px solid #1a56db}
.screen{display:none}.screen.on{display:block}
.timer{background:#1f2937;color:#fff;padding:10px;text-align:center;font-weight:700;font-size:16px}
.qtext{font-size:15px;line-height:1.6;margin:8px 0 14px}
.nav{display:flex;gap:6px;margin-top:12px}
.nav .btn{margin:0;flex:1;padding:10px;font-size:13px}
</style>
</head>
<body>

<!-- ========== SETUP SCREEN ========== -->
<div id="setup" class="screen on">
  <h1>JEE Question Generator</h1>
  <div class="card">
    <h2>1. Subject</h2>
    <div id="subchips"></div>
  </div>
  <div class="card">
    <h2>2. Chapters</h2>
    <div id="chaplist"></div>
    <p style="font-size:12px;color:#666;margin-top:8px" id="chapcount">0 selected</p>
  </div>
  <div class="card">
    <h2>3. Settings</h2>
    <p style="font-size:13px;margin-bottom:8px">Questions: <input type="number" id="qcount" value="5" min="1" max="20" style="width:70px;padding:6px;border:1px solid #ddd;border-radius:6px"></p>
    <p style="font-size:13px">Time (min): <input type="number" id="qtime" value="10" min="1" max="60" style="width:70px;padding:6px;border:1px solid #ddd;border-radius:6px"></p>
    <button class="btn" id="startBtn">Start Test</button>
  </div>
</div>

<!-- ========== EXAM SCREEN ========== -->
<div id="exam" class="screen">
  <div class="timer" id="timer">--:--</div>
  <div id="qbox"></div>
</div>

<!-- ========== RESULT SCREEN ========== -->
<div id="result" class="screen">
  <div class="card" id="rbox"></div>
  <button class="btn" id="homeBtn">Back to Home</button>
</div>

<script>
(function(){
'use strict';

// ---------- SYLLABUS ----------
var SYL={
  Physics:{
    '11':["Kinematics","Laws of Motion","Work Energy Power","Gravitation"],
    '12':["Electrostatics","Current Electricity","Optics","Atoms and Nuclei"]
  },
  Chemistry:{
    '11':["Atomic Structure","Chemical Bonding","Equilibrium","Hydrocarbons"],
    '12':["Chemical Kinetics","Coordination Compounds","Aldehydes Ketones","Biomolecules"]
  },
  Mathematics:{
    '11':["Complex Numbers","Sequence and Series","Straight Lines","Permutations Combinations"],
    '12':["Matrices Determinants","Derivatives","Integrals","Probability"]
  }
};

// ---------- QUESTION BANK (32 questions) ----------
var Q=[
// PHYSICS
{s:"Physics",c:"Kinematics",q:"Ball thrown up u=20 m/s, g=10. Max height?",a:"10 m",b:"20 m",d:"5 m",e:"40 m",ans:2,sol:"v=0 at top. v^2=u^2-2gh: 0=400-20h, h=20 m."},
{s:"Physics",c:"Laws of Motion",q:"5 kg block, mu=0.2, g=10. Min force?",a:"5 N",b:"10 N",d:"20 N",e:"15 N",ans:2,sol:"Limiting friction=mu*m*g=0.2*5*10=10 N."},
{s:"Physics",c:"Work Energy Power",q:"2 kg at 4 m/s hits 2 kg at rest and sticks. KE loss?",a:"4 J",b:"8 J",d:"2 J",e:"16 J",ans:2,sol:"KEi=0.5*2*16=16 J. v=2 m/s. KEf=0.5*4*4=8 J. Loss=8 J."},
{s:"Physics",c:"Gravitation",q:"At height R above Earth, g becomes?",a:"g/2",b:"g/4",d:"2g",e:"g/8",ans:2,sol:"g'=g(R/(R+h))^2=g/4."},
{s:"Physics",c:"Electrostatics",q:"+q and -q separated by 2a. V at midpoint?",a:"kq/a",b:"2kq/a",d:"kq/2a",e:"0",ans:4,sol:"V=kq/a-kq/a=0."},
{s:"Physics",c:"Current Electricity",q:"Wire R stretched to 2x length. New R?",a:"R/2",b:"R",d:"4R",e:"2R",ans:4,sol:"R proportional to L^2. 2^2=4. New R=4R."},
{s:"Physics",c:"Optics",q:"Convex lens f=20 cm, object at 30 cm. Image at?",a:"60 cm other side",b:"60 cm same side",d:"12 cm other side",e:"12 cm same side",ans:1,sol:"1/f=1/v-1/u. 1/20=1/v+1/30. v=60 cm."},
{s:"Physics",c:"Atoms and Nuclei",q:"Bohr model: energy of nth orbit proportional to?",a:"n",b:"1/n^2",d:"n^2",e:"1/n",ans:2,sol:"E_n=-13.6/n^2 eV. |E| proportional to 1/n^2."},
// CHEMISTRY
{s:"Chemistry",c:"Atomic Structure",q:"Radial nodes in 3p orbital?",a:"0",b:"1",d:"3",e:"2",ans:2,sol:"n-l-1=3-1-1=1."},
{s:"Chemistry",c:"Chemical Bonding",q:"Shape of NH4+?",a:"Square planar",b:"Tetrahedral",d:"See-saw",e:"Trigonal pyramidal",ans:2,sol:"4 bond pairs, 0 lone pairs, sp3. Tetrahedral."},
{s:"Chemistry",c:"Equilibrium",q:"pH of 0.01 M HCl?",a:"1",b:"2",d:"7",e:"12",ans:2,sol:"[H+]=10^-2. pH=-log(10^-2)=2."},
{s:"Chemistry",c:"Hydrocarbons",q:"HBr + propene (Markovnikov). Main?",a:"1-bromopropane",b:"2-bromopropane",d:"Propane",e:"1,2-dibromopropane",ans:2,sol:"H adds to C1 (more H), Br adds to C2. 2-bromopropane."},
{s:"Chemistry",c:"Chemical Kinetics",q:"Half-life of 1st order reaction?",a:"1/k",b:"0.693/k",d:"k/0.693",e:"2/k",ans:2,sol:"t_1/2=ln(2)/k=0.693/k."},
{s:"Chemistry",c:"Coordination Compounds",q:"Coordination number of Co in [Co(NH3)6]3+?",a:"3",b:"6",d:"8",e:"4",ans:2,sol:"6 NH3 ligands."},
{s:"Chemistry",c:"Aldehydes Ketones",q:"Which gives Tollens test?",a:"Acetone",b:"Acetaldehyde",d:"Benzophenone",e:"tert-Butanol",ans:2,sol:"Aldehydes reduce Tollens. Acetaldehyde is aldehyde."},
{s:"Chemistry",c:"Biomolecules",q:"Glucose is?",a:"Ketohexose",b:"Aldohexose",d:"Ketopentose",e:"Aldopentose",ans:2,sol:"6 carbons + aldehyde = aldohexose."},
// MATHS
{s:"Mathematics",c:"Complex Numbers",q:"Modulus of 3+4i?",a:"3",b:"5",d:"7",e:"4",ans:2,sol:"sqrt(9+16)=sqrt(25)=5."},
{s:"Mathematics",c:"Sequence and Series",q:"Sum of first 10 terms of 2,5,8,...?",a:"145",b:"155",d:"175",e:"165",ans:2,sol:"a=2,d=3. S=10/2(4+27)=155."},
{s:"Mathematics",c:"Straight Lines",q:"Slope of 2x+3y=6?",a:"2/3",b:"-2/3",d:"-3/2",e:"3/2",ans:2,sol:"y=2-(2/3)x. Slope=-2/3."},
{s:"Mathematics",c:"Permutations Combinations",q:"Distinct arrangements of JEE?",a:"3",b:"6",d:"24",e:"12",ans:1,sol:"3!/2!=3."},
{s:"Mathematics",c:"Matrices Determinants",q:"|A|=4, 3x3 matrix. |2A|=?",a:"8",b:"32",d:"64",e:"16",ans:2,sol:"|kA|=k^n|A|=8*4=32."},
{s:"Mathematics",c:"Derivatives",q:"d/dx sin(x^2)?",a:"cos(x^2)",b:"2x cos(x^2)",d:"x^2 cos(x^2)",e:"2x sin(x^2)",ans:2,sol:"Chain rule: cos(x^2)*2x."},
{s:"Mathematics",c:"Integrals",q:"Integral of sin x from 0 to pi/2?",a:"0",b:"1",d:"pi/2",e:"2",ans:2,sol:"[-cos x]=0+1=1."},
{s:"Mathematics",c:"Probability",q:"P(prime) on single die?",a:"1/6",b:"1/2",d:"2/3",e:"1/3",ans:2,sol:"Primes {2,3,5}. 3/6=1/2."}
];

// ---------- STATE ----------
var state={
  subject:"Physics",
  chapters:{},
  exam:null
};

// ---------- SETUP ----------
function initSetup(){
  // Subject chips
  var subDiv=document.getElementById('subchips');
  subDiv.innerHTML='';
  var subs=['Physics','Chemistry','Mathematics'];
  for(var i=0;i<subs.length;i++){
    (function(sub){
      var btn=document.createElement('button');
      btn.className='chip'+(sub===state.subject?' on':'');
      btn.textContent=sub;
      btn.onclick=function(){
        state.subject=sub;
        state.chapters={};
        var all=document.querySelectorAll('#subchips .chip');
        for(var k=0;k<all.length;k++)all[k].classList.remove('on');
        btn.classList.add('on');
        renderChapters();
      };
      subDiv.appendChild(btn);
    })(subs[i]);
  }
  renderChapters();
  document.getElementById('startBtn').onclick=startTest;
  document.getElementById('homeBtn').onclick=function(){showScreen('setup');};
}

function renderChapters(){
  var div=document.getElementById('chaplist');
  div.innerHTML='';
  var syll=SYL[state.subject];
  var allChapters=[];
  var keys=Object.keys(syll);
  for(var i=0;i<keys.length;i++){
    var arr=syll[keys[i]];
    for(var j=0;j<arr.length;j++)allChapters.push(arr[j]);
  }
  for(var c=0;c<allChapters.length;c++){
    (function(ch){
      var label=document.createElement('label');
      label.className='chap';
      var cb=document.createElement('input');
      cb.type='checkbox';
      cb.checked=!!state.chapters[ch];
      cb.onchange=function(){
        if(cb.checked)state.chapters[ch]=true;
        else delete state.chapters[ch];
        updateChapCount();
      };
      label.appendChild(cb);
      var span=document.createElement('span');
      span.textContent=ch;
      label.appendChild(span);
      div.appendChild(label);
    })(allChapters[c]);
  }
  updateChapCount();
}

function updateChapCount(){
  var n=Object.keys(state.chapters).length;
  document.getElementById('chapcount').textContent=n+' selected';
}

// ---------- START TEST ----------
function startTest(){
  var sel=Object.keys(state.chapters);
  if(sel.length===0){alert('Select at least one chapter');return;}
  var count=parseInt(document.getElementById('qcount').value)||5;
  var mins=parseInt(document.getElementById('qtime').value)||10;

  var pool=[];
  for(var i=0;i<Q.length;i++){
    if(Q[i].s===state.subject && sel.indexOf(Q[i].c)>=0)pool.push(Q[i]);
  }
  if(pool.length===0){alert('No questions for selected chapters');return;}

  // shuffle
  for(var j=pool.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1));
    var t=pool[j];pool[j]=pool[k];pool[k]=t;
  }
  var qs=[];
  for(var m=0;m<count;m++)qs.push(pool[m%pool.length]);

  state.exam={questions:qs,answers:{},current:0,start:0,limit:mins*60,timerId:null,done:false};
  showScreen('exam');
  renderQuestion();
  startTimer();
}

function showScreen(name){
  var all=document.querySelectorAll('.screen');
  for(var i=0;i<all.length;i++)all[i].classList.remove('on');
  document.getElementById(name).classList.add('on');
  window.scrollTo(0,0);
}

// ---------- QUESTION RENDER ----------
function renderQuestion(){
  var e=state.exam;
  var q=e.questions[e.current];
  if(!q)return;

  var opts=[
    {key:1,label:'A',text:q.a},
    {key:2,label:'B',text:q.b},
    {key:3,label:'C',text:q.d},
    {key:4,label:'D',text:q.e}
  ];
  var selected=e.answers[e.current];

  var html='<div class="card">';
  html+='<div style="font-size:12px;color:#1a56db;font-weight:700">Question '+(e.current+1)+' of '+e.questions.length+'</div>';
  html+='<div class="qtext">'+q.q+'</div>';
  for(var i=0;i<opts.length;i++){
    var o=opts[i];
    html+='<div class="opt'+(selected===o.key?' sel':'')+'" data-key="'+o.key+'"><b>'+o.label+'.</b> '+o.text+'</div>';
  }
  html+='<div class="nav">';
  html+='<button class="btn sec" id="prevBtn"'+(e.current===0?' disabled':'')+'>Prev</button>';
  if(e.current<e.questions.length-1){
    html+='<button class="btn" id="nextBtn">Next</button>';
  }else{
    html+='<button class="btn" id="submitBtn">Submit</button>';
  }
  html+='</div></div>';
  document.getElementById('qbox').innerHTML=html;

  // option clicks
  var optDivs=document.querySelectorAll('#qbox .opt');
  for(var p=0;p<optDivs.length;p++){
    (function(div){
      div.onclick=function(){
        state.exam.answers[state.exam.current]=parseInt(div.getAttribute('data-key'));
        renderQuestion();
      };
    })(optDivs[p]);
  }

  // prev
  var prevBtn=document.getElementById('prevBtn');
  if(prevBtn&&!prevBtn.disabled){
    prevBtn.onclick=function(){
      if(state.exam.current>0){state.exam.current--;renderQuestion();}
    };
  }
  // next
  var nextBtn=document.getElementById('nextBtn');
  if(nextBtn){
    nextBtn.onclick=function(){
      if(state.exam.current<state.exam.questions.length-1){
        state.exam.current++;
        renderQuestion();
        window.scrollTo(0,0);
      }
    };
  }
  // submit
  var submitBtn=document.getElementById('submitBtn');
  if(submitBtn){
    submitBtn.onclick=function(){
      var un=0;
      for(var u=0;u<state.exam.questions.length;u++)if(state.exam.answers[u]===undefined)un++;
      if(confirm(un>0?'You have '+un+' unanswered. Submit?':'Submit test?'))finishTest();
    };
  }
}

// ---------- TIMER ----------
function startTimer(){
  var e=state.exam;
  e.start=Date.now();
  if(e.timerId)clearInterval(e.timerId);
  function update(){
    var elapsed=Math.floor((Date.now()-e.start)/1000);
    var rem=Math.max(0,e.limit-elapsed);
    var m=Math.floor(rem/60);
    var s=rem%60;
    var el=document.getElementById('timer');
    if(el)el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    if(rem<=0){clearInterval(e.timerId);finishTest();}
  }
  update();
  e.timerId=setInterval(update,500);
}

// ---------- RESULT ----------
function finishTest(){
  var e=state.exam;
  if(e.done)return;
  e.done=true;
  if(e.timerId)clearInterval(e.timerId);

  var correct=0,wrong=0,unattempted=0;
  var details=[];
  for(var i=0;i<e.questions.length;i++){
    var q=e.questions[i];
    var ans=e.answers[i];
    var has=ans!==undefined;
    var ok=has&&ans===q.ans;
    if(!has)unattempted++;
    else if(ok)correct++;
    else wrong++;
    details.push({num:i+1,chapter:q.c,question:q.q,opts:{a:q.a,b:q.b,c:q.d,d:q.e},correct:q.ans,user:ans,has:has,ok:ok,sol:q.sol});
  }
  var score=correct*4-wrong;
  var max=e.questions.length*4;
  var acc=(correct+wrong)>0?Math.round(correct/(correct+wrong)*100):0;
  var pct=max>0?Math.round(score/max*100):0;

  var html='<div style="text-align:center">';
  html+='<div style="width:120px;height:120px;border:6px solid #1a56db;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 12px">';
  html+='<b style="font-size:30px;color:#1a56db">'+score+'</b><small style="font-size:11px;color:#666">of '+max+'</small></div>';
  html+='<p style="font-weight:700">'+pct+'% Score</p>';
  html+='<p style="font-size:12px;color:#666">Accuracy: '+acc+'%</p>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">';
  html+='<div style="background:#f3f4f6;padding:12px;border-radius:8px;text-align:center"><b style="display:block;font-size:20px;color:#059669">'+correct+'</b><small style="font-size:11px;color:#666">Correct</small></div>';
  html+='<div style="background:#f3f4f6;padding:12px;border-radius:8px;text-align:center"><b style="display:block;font-size:20px;color:#dc2626">'+wrong+'</b><small style="font-size:11px;color:#666">Wrong</small></div>';
  html+='<div style="background:#f3f4f6;padding:12px;border-radius:8px;text-align:center"><b style="display:block;font-size:20px;color:#6b7280">'+unattempted+'</b><small style="font-size:11px;color:#666">Unattempted</small></div>';
  html+='<div style="background:#f3f4f6;padding:12px;border-radius:8px;text-align:center"><b style="display:block;font-size:20px">'+pct+'%</b><small style="font-size:11px;color:#666">Percent</small></div>';
  html+='</div></div>';

  html+='<h2 style="margin-top:20px;font-size:14px">Detailed Solutions</h2>';
  for(var d=0;d<details.length;d++){
    var det=details[d];
    var status=det.has?(det.ok?'ok':'no'):'un';
    var tagText=det.has?(det.ok?'Correct':'Incorrect'):'Not attempted';
    var letters=['A','B','C','D'];
    var keys2=['a','b','c','d'];
    var cLet=letters[det.correct-1];
    var cTxt=det.opts[keys2[det.correct-1]];
    var uTxt=det.has?(letters[det.user-1]+'. '+det.opts[keys2[det.user-1]]):'(no answer)';

    html+='<div style="border:1px solid #e5e7eb;border-radius:8px;margin-top:10px;overflow:hidden">';
    html+='<div style="background:#f3f4f6;padding:10px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between" onclick="this.nextElementSibling.classList.toggle(\'on\')">';
    html+='<span>Q'+det.num+' - '+det.chapter+'</span>';
    html+='<span style="padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;background:'+(status==='ok'?'#d1fae5':status==='no'?'#fee2e2':'#f3f4f6')+';color:'+(status==='ok'?'#065f46':status==='no'?'#991b1b':'#4b5563')+'">'+tagText+'</span>';
    html+='</div>';
    html+='<div style="padding:10px;font-size:13px;line-height:1.6;display:none" class="solb">';
    html+='<p>'+det.question+'</p>';
    html+='<p><b>Your:</b> '+uTxt+'</p>';
    html+='<p><b>Correct:</b> '+cLet+'. '+cTxt+'</p>';
    html+='<p style="background:#f3f4f6;padding:8px;border-radius:6px;margin-top:8px"><b>Solution:</b> '+det.sol+'</p>';
    html+='</div></div>';
  }

  document.getElementById('rbox').innerHTML=html;
  showScreen('result');
}

// boot
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initSetup);
else initSetup();

})();
</script>
</body>
</html>
